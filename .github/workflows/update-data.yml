name: Update dashboard data

on:
  schedule:
    # 每周一至周五，台北时间 07:00；不排除节假日。
    - cron: '0 7 * * 1-5'
      timezone: Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 定时任务与手动任务串行，避免同时修改 data.json。
concurrency:
  group: update-dashboard-data
  cancel-in-progress: false

jobs:
  update:
    name: Fetch and commit data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          # 手动运行也统一更新默认分支。
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch latest data
        id: fetch
        shell: python
        run: |
          import os
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "update_data.py", "--history-days", "30"],
              check=False,
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"exit_code={result.returncode}\n")
          descriptions = {
              0: "所有数据源获取成功。",
              2: "部分或全部数据源获取失败；成功项将提交，失败项保留原值。详情见 Fetch latest data 日志。",
          }
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(descriptions.get(result.returncode, "脚本异常退出，取消提交。") + "\n")
          # 退出码 2 可能已写入部分新数据，让提交步骤先执行。
          if result.returncode not in (0, 2):
              sys.exit(1)

      - name: Commit updated data
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json 没有变化，无需提交。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 仅提交数据文件，不包含脚本生成的 .bak 或临时文件。
          git add -- data.json
          git commit -m "chore: update dashboard data"
          # 普通推送；远端有并发修改时失败，避免覆盖用户提交。
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "已将 data.json 提交到默认分支。" >> "$GITHUB_STEP_SUMMARY"

      - name: Report data source failures
        if: steps.fetch.outputs.exit_code == '2'
        run: |
          echo "::error::部分或全部数据源获取失败。成功更新的数据已在上一提交步骤处理，请查看获取日志。"
          exit 1

      - name: Upload site for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy-pages:
    name: Deploy GitHub Pages
    needs: update
    if: always() && needs.update.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
